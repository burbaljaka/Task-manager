{% extends 'basic_app/base.html' %}
{% block body_block %}
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
        <!-- Card Header with gradient -->
        <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #4a6fa5 0%, #6b8fc7 100%); border: none;">
          <h2 class="mb-0 text-white fw-bold" style="font-size: 1.75rem; letter-spacing: 0.5px;">
            Welcome Back
          </h2>
          <p class="text-white-50 mb-0 mt-2" style="font-size: 0.9rem;">Sign in to your account</p>
        </div>
        
        <!-- Card Body -->
        <div class="card-body p-4">
          <form method="post" action="{% url 'basic_app:user_login' %}">
            {% csrf_token %}
            
            <!-- Username Field -->
            <div class="mb-4">
              <label for="username" class="form-label fw-semibold" style="color: #4a6fa5; font-size: 0.9rem; margin-bottom: 0.5rem;">
                Username
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text" style="background: #f3f8fc; border: 2px solid #e3f0ff; border-right: none; border-radius: 12px 0 0 12px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#4a6fa5" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                  </svg>
                </span>
                <input 
                  type="text" 
                  name="username" 
                  id="username" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your username"
                  required
                  autofocus
                  style="border-radius: 0 12px 12px 0; border: 2px solid #e3f0ff; border-left: none; padding: 0.75rem 1rem; transition: all 0.3s ease;"
                  onfocus="this.style.borderColor='#4a6fa5'; this.parentElement.querySelector('.input-group-text').style.borderColor='#4a6fa5'; this.style.boxShadow='0 0 0 0.2rem rgba(74,111,165,0.15)';"
                  onblur="this.style.borderColor='#e3f0ff'; this.parentElement.querySelector('.input-group-text').style.borderColor='#e3f0ff'; this.style.boxShadow='none';"
                >
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold" style="color: #4a6fa5; font-size: 0.9rem; margin-bottom: 0.5rem;">
                Password
              </label>
              <div class="input-group input-group-lg">
                <span class="input-group-text" style="background: #f3f8fc; border: 2px solid #e3f0ff; border-right: none; border-radius: 12px 0 0 12px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#4a6fa5" viewBox="0 0 16 16">
                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
                  </svg>
                </span>
                <input 
                  type="password" 
                  name="password" 
                  id="password" 
                  class="form-control form-control-lg" 
                  placeholder="Enter your password"
                  required
                  style="border-radius: 0 12px 12px 0; border: 2px solid #e3f0ff; border-left: none; padding: 0.75rem 1rem; transition: all 0.3s ease;"
                  onfocus="this.style.borderColor='#4a6fa5'; this.parentElement.querySelector('.input-group-text').style.borderColor='#4a6fa5'; this.style.boxShadow='0 0 0 0.2rem rgba(74,111,165,0.15)';"
                  onblur="this.style.borderColor='#e3f0ff'; this.parentElement.querySelector('.input-group-text').style.borderColor='#e3f0ff'; this.style.boxShadow='none';"
                >
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mb-3">
              <button 
                type="submit" 
                class="btn btn-lg text-white fw-bold" 
                style="background: linear-gradient(135deg, #4a6fa5 0%, #6b8fc7 100%); border: none; border-radius: 12px; padding: 0.75rem; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(74,111,165,0.3);"
                onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(74,111,165,0.4)';"
                onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(74,111,165,0.3)';"
              >
                Sign In
              </button>
            </div>

            <!-- Register Link -->
            <div class="text-center">
              <p class="mb-0" style="color: #6c757d; font-size: 0.9rem;">
                Don't have an account? 
                <a href="{% url 'basic_app:register' %}" class="text-decoration-none fw-semibold" style="color: #4a6fa5;">
                  Sign up here
                </a>
              </p>
            </div>
          </form>
        </div>
      </div>

      <!-- Additional Info Card (optional) -->
      <div class="text-center mt-4">
        <p class="text-muted" style="font-size: 0.85rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="display: inline-block; vertical-align: -2px; margin-right: 4px;">
            <path d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.465 9.99a11.777 11.777 0 0 0 2.517 2.453c.386.273.744.482 1.048.625.28.132.581.24.829.24s.548-.108.829-.24a7.159 7.159 0 0 0 1.048-.625 11.775 11.775 0 0 0 2.517-2.453c1.678-2.195 3.061-5.513 2.465-9.99a1.541 1.541 0 0 0-1.044-1.263 62.467 62.467 0 0 0-2.887-.87C9.843.266 8.69 0 8 0zm-.5 5a.5.5 0 0 1 1 0v1.5a.5.5 0 0 1-1 0V5zm0 3a.5.5 0 0 1 1 0v3a.5.5 0 0 1-1 0V8z"/>
          </svg>
          Your data is secure and encrypted
        </p>
      </div>
    </div>
  </div>
</div>

<style>
  /* Smooth animations */
  .card {
    animation: fadeInUp 0.5s ease-out;
  }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  /* Form input focus styles */
  .form-control:focus {
    border-color: #4a6fa5 !important;
    box-shadow: 0 0 0 0.2rem rgba(74,111,165,0.15) !important;
  }
  
  /* Input group text focus */
  .input-group:focus-within .input-group-text {
    border-color: #4a6fa5 !important;
  }
  
  /* Responsive adjustments */
  @media (max-width: 768px) {
    .card {
      margin: 0.5rem;
    }
    
    .card-header h2 {
      font-size: 1.5rem !important;
    }
    
    .card-body {
      padding: 1.5rem !important;
    }
    
    .input-group-lg .form-control,
    .input-group-lg .input-group-text {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
    }
    
    .btn-lg {
      padding: 0.625rem 1.5rem;
      font-size: 1rem;
    }
  }
  
  @media (max-width: 576px) {
    .container {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
    }
    
    .card-header {
      padding: 1.5rem 1rem !important;
    }
    
    .card-header h2 {
      font-size: 1.25rem !important;
    }
    
    .card-header p {
      font-size: 0.8rem !important;
    }
  }
</style>
{% endblock %}
