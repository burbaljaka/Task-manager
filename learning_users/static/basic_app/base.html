<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tasks</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', Arial, sans-serif;
        background: linear-gradient(135deg, #e3f0ff 0%, #f7fafc 100%);
        min-height: 100vh;
      }
      .navbar {
        border-radius: 0 0 16px 16px;
        box-shadow: 0 2px 8px rgba(60, 120, 180, 0.07);
        background: #f3f8fc !important;
      }
      .navbar-brand {
        color: #4a6fa5 !important;
        letter-spacing: 1px;
      }
      .navbar-nav .nav-link {
        color: #5b7c99 !important;
        transition: color 0.2s;
      }
      .navbar-nav .nav-link:hover {
        color: #3c5f7f !important;
      }
      .card, .table, .dropdown-menu {
        background: #fafdff !important;
        border-radius: 12px !important;
      }
      .card-header, .table-primary {
        background: #e2eafc !important;
        color: #4a6fa5 !important;
        border-radius: 12px 12px 0 0 !important;
      }
      .btn-outline-danger {
        border-color: #c8d6e5;
        color: #6c7a89;
        background: #fafdff;
      }
      .btn-outline-danger:hover {
        background: #e3f0ff;
        color: #c0392b;
      }
      .bg-light {
        background: #f3f8fc !important;
      }
      .text-primary {
        color: #4a6fa5 !important;
      }
      .rounded {
        border-radius: 12px !important;
      }
    </style>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
      <div class="container-fluid flex-column align-items-center justify-content-center">
        <div class="w-100 d-flex justify-content-center align-items-center" style="min-height:40px;">
          <a class="navbar-brand fw-bold text-center" href="{% url 'index' %}" style="font-size:1.6rem; margin:0 auto;">Welcome page</a>
        </div>
        <div class="collapse navbar-collapse justify-content-center w-100 mt-1" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            {% if user.is_authenticated %}
              <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
              <li class="nav-item"><a class="nav-link" href="{% url 'basic_app:user_tasks_view' %}">Your tasks, {{ user.username }}</a></li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="reportsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Reports</a>
                <ul class="dropdown-menu" aria-labelledby="reportsDropdown">
                  <li><a class="dropdown-item" href="{% url 'basic_app:reports' %}?period=this_day">This day</a></li>
                  <li><a class="dropdown-item" href="{% url 'basic_app:reports' %}?period=last_day">Previous day</a></li>
                  <li><a class="dropdown-item" href="{% url 'basic_app:reports' %}?period=15_days">15 last days</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="{% url 'basic_app:reports' %}?period=this_month">Current month</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="{% url 'basic_app:reports' %}?period=last_month">Last month</a></li>
                </ul>
              </li>
            {% else %}
              <li class="nav-item"><a class="nav-link" href="{% url 'basic_app:user_login' %}">Login</a></li>
              <li class="nav-item"><a class="nav-link" href="{% url 'basic_app:register' %}">Register</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      {% block body_block %}{% endblock %}
    </div>
  </body>
</html>
